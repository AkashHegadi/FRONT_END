<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <form target="_blank" action="thank.html">
        <!-- <label for="first_name">first name :</label> -->
        <input required type="text" name="first_name" id="" placeholder="enter first name">
        <!-- <label for="last_name">last name :</label> -->
        <input type="text" name="last_name" id="" placeholder="enter last name"> <br> <br>
        <!-- <label for="content">content :</label> -->
        <input required maxlength="10" type="tel" name="contact" id="" placeholder="enter contact number"> <br><br>
        DOB : <input type="datetime-local" name="" id=""> <br><br>
        insert : <input type="file" name="" id=""><br> <br>
         <!-- <label for="email">email :</label> -->
         <input required type="email" name="email" id="" placeholder="eg:abc@gmail.com"><br> <br>
        <!-- <label for="password">password</label> -->
        <input required type="password" name="password" id="" placeholder="enter password"><br><br>
         <!-- <label for="address">address : </label><br>  -->
         <textarea required name="address" id="" cols="40" rows="10" placeholder="enter address"></textarea><br><br>
         <label for="gender">male</label>
         <input required type="radio" name="gender" id="">
         <label for="gender">female</label>
         <input required type="radio" name="gender" id=""><br><br>
         <label for="kannada">kannada</label>
         <input type="checkbox" name="kannada" id="">
         <label for="english">english</label>
         <input type="checkbox" name="english" id="">
         <label for="russian">russian</label>
         <input type="checkbox" name="russian" id=""><br><br>
         <label for="java">java</label>
         <input type="checkbox" name="java" id="">
         <label for="python">python</label>
         <input type="checkbox" name="python" id="">
         <label for="sql">sql</label>
         <input type="checkbox" name="sql" id="">
         <label for="spring">spring</label>
         <input type="checkbox" name="spring" id="">
         <label for="c">c</label>
         <input type="checkbox" name="c" id="">
         <label for="html">hmtl</label>
         <input type="checkbox" name="html" id=""><br><br>
         <input type="submit" name="" id="">
         <input type="reset" name="" id="">
    </form>
</body>
</html>
